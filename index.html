  <script>(function () {

  if (!mute) return;
  window.__cbnMuted = true;
  var AC = window.AudioContext || window.webkitAudioContext;
  if (AC) {
    var getDest = null;
    for (var p = AC.prototype; p && !getDest; p = Object.getPrototypeOf(p)) {
      var d = Object.getOwnPropertyDescriptor(p, 'destination');
      if (d && d.get) getDest = d.get;
    }
    var Muted = class extends AC {
      constructor(options) {
        super(options);
        var silent = this.createGain();
        silent.gain.value = 0;
        silent.connect(getDest.call(this));
        Object.defineProperty(this, 'destination', { value: silent, configurable: true });
      }
    };
    window.AudioContext = Muted;
    window.webkitAudioContext = Muted;
  }
  var play = HTMLMediaElement.prototype.play;
  HTMLMediaElement.prototype.play = function () { this.muted = true; return play.call(this); };
})();</script>
